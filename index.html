<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=lock" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="border-bottom border-2 d-flex justify-content-center bg-white">
        <div class="div-tam-1">
            <nav class="py-1 d-flex justify-content-between align-items-center ">
                <a href="#" class="font-tam1 text-primary text-decoration-none mx-3">
                    <p class="fw-bold">Checkout</p>
                </a>
                <span class="material-symbols-outlined text-primary mx-3">
                    lock
                </span>
            </nav>
        </div>
    </header>
    <main class="d-flex justify-content-center">
        <div class="div-tam-1">
            <section class=" mt-5 d-flex justify-content-center">
                <div class="div-tam-2 d-flex justify-content-between">
                    <div class="d-flex flex-column align-items-center ms-3">
                        <div
                            class="stages rounded-4 bg-primary text-white d-flex justify-content-center align-items-center border-primary">
                            1</div>
                        <p class="fs-6 text-primary">Pessoal</p>
                    </div>
                    <div class="line-1 flex-shrink-1 mx-1 border border-1 mt-0"></div>
                    <div class="d-flex flex-column align-items-center">
                        <div
                            class="stages border border-secondary-subtle rounded-4 bg-surface text-muted d-flex justify-content-center align-items-center">
                            2</div>
                        <p class="fs-6">Entrega</p>
                    </div>
                    <div class="line-1 flex-shrink-1 mx-1 border border-1 mt-0"></div>
                    <div class="d-flex flex-column align-items-center me-3">
                        <div
                            class="stages border border-secondary-subtle rounded-4 bg-surface text-muted d-flex justify-content-center align-items-center">
                            3</div>
                        <p class="fs-6">Pedido</p>
                    </div>
                </div>
            </section>
            <div class="row mt-1">
                <form action="#" class="border border-2 rounded-1 bg-white p-5 col-8">
                    <h4 class="fw-medium mt-1">Dados Pessoais</h4>
                    <div class="line-2 border border-1"></div>
                    <div class="row my-3 mx-1">
                        <div class="mb-4 position-relative">
                            <label for="nomeCompleto" class="bg-white px-1 small position-absolute label-position">Nome
                                Completo</label>
                            <input type="text" class="form-control form-control-lg" id="nomeCompleto" placeholder="">
                        </div>
                        <div class="mb-4 position-relative">
                            <label for="email"
                                class="bg-white px-1 small position-absolute label-position">Email</label>
                            <input type="text" class="form-control form-control-lg" id="email" placeholder="">
                        </div>
                        <div class="mb-4 position-relative">
                            <label for="telefone"
                                class="bg-white px-1 small position-absolute label-position">Telefone</label>
                            <input type="number" class="form-control form-control-lg" id="telefone" placeholder="">
                        </div>
                    </div>
                    <div class="line-2 border border-1"></div>
                </form>
            </div>
        </div>
    </main>
    <!-- Bootstrap JS -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Multi Step</title>
    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=lock" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=inventory_2" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <!-- CSS -->
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="shopping_cart_24dp_0000F5_FILL1_wght400_GRAD0_opsz24.svg" type="image/x-icon">
</head>

<body>
    <header class="border-bottom border-2 d-flex justify-content-center bg-white">
        <div class="div-tam-1">
            <nav class="py-1 d-flex justify-content-between align-items-center ">
                <a href="#" class="font-tam1 text-primary text-decoration-none mx-3">
                    <p class="fw-bold">Checkout</p>
                </a>
                <span class="material-symbols-outlined text-primary mx-3">
                    lock
                </span>
            </nav>
        </div>
    </header>
    <main class="d-flex justify-content-center">
        <div class="div-tam-1">
            <section class=" mt-5 d-flex justify-content-center">
                <div class="div-tam-2 d-flex justify-content-between">
                    <div class="d-flex flex-column align-items-center ms-3">
                        <div
                            class="stages rounded-4 bg-primary text-white d-flex justify-content-center align-items-center border-primary">
                            1</div>
                        <p class="fs-6 text-primary">Pessoal</p>
                    </div>
                    <div class="line-1 flex-shrink-1 mx-1 border border-1 mt-0"></div>
                    <div class="d-flex flex-column align-items-center">
                        <div
                            class="stages border border-secondary-subtle rounded-4 bg-surface text-muted d-flex justify-content-center align-items-center">
                            2</div>
                        <p class="fs-6">Entrega</p>
                    </div>
                    <div class="line-1 flex-shrink-1 mx-1 border border-1 mt-0"></div>
                    <div class="d-flex flex-column align-items-center me-3">
                        <div
                            class="stages border border-secondary-subtle rounded-4 bg-surface text-muted d-flex justify-content-center align-items-center">
                            3</div>
                        <p class="fs-6">Pedido</p>
                    </div>
                </div>
            </section>
            <div class="row mt-1 g-4">
                <div class="col-12 col-md-8">
                    <form action="#" class="border border-2 rounded-1 bg-white px-4 py-4">
                        <h4 class="fw-medium mt-1">Dados Pessoais</h4>
                        <div class="line-2 border border-1"></div>
                        <div class="row mt-3">
                            <div class="mb-4 position-relative col-12">
                                <input type="text" class="form-control form-control-lg py-3" id="nomeCompleto"
                                    placeholder="">
                                <label for="nomeCompleto"
                                    class="bg-white px-1 small position-absolute label-position">Nome
                                    Completo</label>
                            </div>
                            <div class="mb-4 position-relative col-md-6">
                                <input type="text" class="form-control form-control-lg py-3" id="email" placeholder="">
                                <label for="email"
                                    class="bg-white px-1 small position-absolute label-position">Email</label>
                            </div>
                            <div class="mb-4 position-relative col-md-6">
                                <input type="text" class="form-control form-control-lg py-3" id="telefone"
                                    placeholder="">
                                <label for="telefone"
                                    class="bg-white px-1 small position-absolute label-position">Telefone</label>
                            </div>
                        </div>
                        <div class="line-2 border border-1"></div>
                        <div class="d-flex flex-row-reverse mt-4">
                            <button class="btn btn-primary small fw-semibold px-4 border rounded-1">Próximo</button>
                        </div>
                    </form>
                </div>
                <div class="col-12 col-md-4">
                    <aside class="border border-2 rounded-1 bg-surface px-4 py-4">
                        <h4 class="fw-medium mt-0">Resumo do Pedido</h4>
                        <div class="d-flex justify-content-between">
                            <div
                                class="inventory-badge border border-secondary-subtle bg-white d-flex align-items-center justify-content-center">
                                <span class="material-symbols-outlined text-secondary">
                                    inventory_2
                                </span>
                            </div>
                            <div class="text-wrap d-flex flex-column gap-0 justify-content-center">
                                <p class="font-px1 fw-medium mb-0">Plano Profissional</p>
                                <p class="font-px2 mb-0">Assinatura Anual</p>
                            </div>
                            <div class="fw-medium d-flex align-items-center">R$ 599,99</div>
                            <div class=""></div>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </main>
    <!-- Bootstrap JS -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
